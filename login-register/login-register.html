<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Pop-up Registration Form</title>
    <style>
            /* Styles for the overlay */
    .popup {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        justify-content: center;
        align-items: center;
    }

    /* Styles for the pop-up content */
    .popup-content {
        background-color: #fff;
        padding: 20px;
        border-radius: 5px;
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.5);
        position: relative;
        text-align: center;
        max-width: 80%;
    }

    .close {
        position: absolute;
        top: 10px;
        right: 10px;
        font-size: 20px;
        cursor: pointer;
    }
    /* Other styling for form fields can be added here */
    </style>

</head>
<body>

<button id="openForm">Register</button>

<!-- REGISTERATION FORM -->

<div id="registrationForm" class="popup">
    <div class="popup-content">

        <span id="closeForm" class="close">&times;</span>
        <h2>Registration Form</h2>

        <form action="#">
            <!-- ... your registration form fields ... -->
                        <label for="username">Username:</label>
                <input type="text" id="username" name="username" required><br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required><br><br>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required><br><br>

                <label for="confirm_password">Confirm Password:</label>
                <input type="password" id="confirm_password" name="confirm_password" required><br><br>
            <input type="submit" value="Register">
        </form>

        <p>Already have an account? <a href="#" id="switchToLogin">Log in</a></p>

    </div>
</div>

<script>
    document.getElementById("registrationForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const username = document.getElementById("username").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const registrationData = {
        username: username,
        email: email,
        password: password
    };

    // Send registration data to backend (make an API call)
    fetch('/register', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(registrationData)
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            alert('Registration successful! Please check your email for verification.');
        } else {
            alert('Registration failed. Please try again.');
        }
    });
});

</script>

<!-- -------------------------------------------------------- -->
<!-- LOGIN FORM-->

<div id="loginForm" class="popup">
    <div class="popup-content">

        <span id="closeLogin" class="close">&times;</span>
        <h2>Login Form</h2>

        <form action="#">
            <label for="loginUsername">Username:</label>
                <input type="text" id="loginUsername" name="loginUsername" required><br><br>
                
                <label for="loginPassword">Password:</label>
                <input type="password" id="loginPassword" name="loginPassword" required><br><br>
                
                <input type="submit" value="Log In">
        </form>

        <p>Don't have an account yet? <a href="#" id="switchToRegistration">Register</a></p>

    </div>
</div>

<!-- ----------------------------------------------------------------------------- -->
<!-- SCRIPT FOR THE CODES -->

<script>
    const registrationForm = document.getElementById("registrationForm");
    const loginForm = document.getElementById("loginForm");

    document.getElementById("openForm").addEventListener("click", function() {
        registrationForm.style.display = "block";
    });

    document.getElementById("closeForm").addEventListener("click", function() {
        registrationForm.style.display = "none";
    });

    document.getElementById("switchToLogin").addEventListener("click", function() {
        registrationForm.style.display = "none";
        loginForm.style.display = "block";
    });

    document.getElementById("closeLogin").addEventListener("click", function() {
        loginForm.style.display = "none";
    });

    document.getElementById("switchToRegistration").addEventListener("click", function() {
        loginForm.style.display = "none";
        registrationForm.style.display = "block";
    });

    

const express = require('express');
const app = express();
const bodyParser = require('body-parser');
const nodemailer = require('nodemailer');
const crypto = require('crypto'); // For generating verification tokens

app.use(bodyParser.json());

// Mock database for simplicity
const users = [];

// Generate a random token
function generateVerificationToken() {
    return crypto.randomBytes(32).toString('hex');
}

// Send verification email
function sendVerificationEmail(email, token) {
    // Configure email sending service (e.g., nodemailer)
    const transporter = nodemailer.createTransport({
        service: 'your-email-service',
        auth: {
            user: 'your-email@example.com',
            pass: 'your-email-password'
        }
    });

    const verificationLink = `https://your-app.com/verify?token=${token}`;

    // Send email
    const mailOptions = {
        from: '21ftt1753@student.pb.edu.bn',
        to: email,
        subject: 'Email Verification',
        html: `Click <a href="${verificationLink}">here</a> to verify your email.`
    };

    transporter.sendMail(mailOptions, (error, info) => {
        if (error) {
            console.error(error);
        } else {
            console.log('Email sent: ' + info.response);
        }
    });
}

app.post('/register', (req, res) => {
    const { username, email, password } = req.body;
    const verificationToken = generateVerificationToken();

    const newUser = {
        username: username,
        email: email,
        password: password,
        isVerified: false, // Initial status
        verificationToken: verificationToken
    };

    users.push(newUser);

    // Send verification email
    sendVerificationEmail(email, verificationToken);

    res.json({ success: true });
});

app.listen(3000, () => {
    console.log('Server is running on port 3000');
});

</script>
</body>
</html>

</body>
</html>
