<!DOCTYPE html>
<html>
<head>
    <title>Share Location</title>
    <link rel="stylesheet" href="style.css">
    <!--still working on api keys -->
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&libraries=places" async defer></script>
    <script>
        let map;
        let infoWindow;

        function initMap() {
            map = new google.maps.Map(document.getElementById('map'), {
                center: { lat: 0, lng: 0 },
                zoom: 15
            });

            infoWindow = new google.maps.InfoWindow();

            // Create a button to share current location
            const shareCurrentLocationButton = document.getElementById('share-current-location');
            shareCurrentLocationButton.addEventListener('click', () => {
                shareCurrentLocation();
            });

            // Create a button to share a desired location (you can implement this separately)
            const shareDesiredLocationButton = document.getElementById('share-desired-location');
            shareDesiredLocationButton.addEventListener('click', () => {
                // Implement code to share a desired location here
            });
        }

        function shareCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    const currentLocation = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };
                    map.setCenter(currentLocation);
                    const marker = new google.maps.Marker({
                        position: currentLocation,
                        map: map
                    });

                    infoWindow.setContent('Current Location');
                    infoWindow.open(map, marker);
                }, () => {
                    handleLocationError(true, infoWindow, map.getCenter());
                });
            } else {
                handleLocationError(false, infoWindow, map.getCenter());
            }
        }

        function handleLocationError(browserHasGeolocation, infoWindow, currentLocation) {
            infoWindow.setPosition(currentLocation);
            infoWindow.setContent(browserHasGeolocation ?
                'Error: The Geolocation service failed.' :
                'Error: Your browser doesn\'t support geolocation.');
            infoWindow.open(map);
        }
    </script>
</head>
<body onload="initMap()">
    <div>
        <button id="share-current-location">Share Current Location</button>
        <button id="share-desired-location">Share Desired Location</button>
    </div>
    <div id="map" style="height: 400px;"></div>


    <div class="container">
        <h1>Send Location</h1>
        <div class="map">
            <!-- You can use an iframe to embed a map from a service like Google Maps. -->
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3115.6567922467883!2d-122.08404718464285!3d37.42199977984759!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8085808f03d00323%3A0x98f9c8b0d159d3a6!2sGolden%20Gate%20Bridge!5e0!3m2!1sen!2sus!4v1632070806936!5m2!1sen!2sus" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
        </div>
        <button class="send-button">Send Location</button>
    </div>

</body>
</html>
